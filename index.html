/* ===== loader / progress / to-top ===== */
#loader{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--bg);animation:lfade .5s 2.4s forwards;transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
@keyframes lfade{to{opacity:0;visibility:hidden}}
.ld{position:relative;width:min(340px,80vw);text-align:center}
.ld img{width:100%;position:relative;z-index:2;animation:ldpulse 1.6s ease-in-out infinite}
.ld .ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:4px solid transparent;border-top-color:var(--pri);border-right-color:var(--blue2);animation:spin 1s linear infinite;z-index:1;opacity:.55}
.ld .bar2{height:4px;border-radius:9px;background:var(--line);margin:26px auto 0;width:70%;overflow:hidden}.ld .bar2 i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pri),var(--blue2));border-radius:9px;animation:slide 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes ldpulse{50%{transform:scale(1.04);opacity:.85}}@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#sp{position:fixed;top:0;left:0;height:4px;width:100%;z-index:120;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--pri),var(--pri2),var(--blue2));box-shadow:0 0 10px rgba(255,90,31,.5)}
#rbar{position:fixed;top:4px;left:0;height:3px;width:100%;z-index:119;background:var(--blue2);transform-origin:0 50%;transform:scaleX(0);opacity:0}
#rbar.go{animation:rb .55s ease-out}@keyframes rb{0%{transform:scaleX(0);opacity:1}80%{transform:scaleX(.9);opacity:1}100%{transform:scaleX(1);opacity:0}}
#totop{position:fixed;right:18px;bottom:92px;z-index:80;width:46px;height:46px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh);font-size:20px;display:grid;place-items:center;opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:.25s;color:var(--pri);font-weight:800}
#totop.on{opacity:1;transform:none;pointer-events:auto}#totop:hover{background:var(--pri);color:#fff;transform:translateY(-3px)}
#proc{position:fixed;inset:0;z-index:300;background:rgba(10,12,30,.55);backdrop-filter:blur(4px);display:none;place-items:center}#proc.on{display:grid;animation:fade .15s}
#proc .pb{background:var(--card);border-radius:22px;padding:26px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);min-width:240px;animation:pop .25s}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pri);border-right-color:var(--blue2);animation:spin .8s linear infinite;margin:0 auto 12px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pri);margin:0 2px;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{40%{transform:translateY(-6px)}}
/* animated background */

.vis{border-radius:22px;padding:22px;background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.18);position:relative;overflow:hidden}
.band .vis p,.band .vis li{color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:10px}.tl div{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:13.5px;font-weight:600;animation:up .6s backwards}.tl div:nth-child(2){animation-delay:.15s}.tl div:nth-child(3){animation-delay:.3s}.tl div:nth-child(4){animation-delay:.45s}.tl i{font-style:normal;font-size:20px}.tl em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ok)}
.ecoW{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:12px;border:1px solid var(--line)}
.ecoW svg{width:100%;height:auto;display:block}
.eco-n{transition:transform .3s;transform-box:fill-box;transform-origin:center;cursor:default}.eco-n:hover{transform:scale(1.1)}
.eco-ring{animation:spin 60s linear infinite;transform-origin:250px 250px}
.marq{overflow:hidden;position:relative;padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq .tr{display:flex;gap:16px;width:max-content;animation:mq 34s linear infinite}.marq:hover .tr{animation-play-state:paused}
.marq .lgb{width:128px;height:64px;border:1.5px solid #14142b;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;padding:6px;transition:.25s}.marq .lgb img{max-width:100%;max-height:100%;object-fit:contain}.marq .lgb:hover{transform:translateY(-4px) scale(1.05);border-color:var(--pri);box-shadow:var(--sh)}

@keyframes mq{to{transform:translateX(-50%)}}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center}@media(max-width:700px){.stat4{grid-template-columns:repeat(2,1fr)}}
.stat4 .card b{font-size:30px;display:block;color:var(--pri);font-family:Poppins,Inter,sans-serif}
/* footer v3 */

.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.3fr;gap:26px}@media(max-width:1000px){.fgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.fi2{display:flex;gap:12px;margin:12px 0;font-size:14px;align-items:flex-start}.fi2 i{font-style:normal;opacity:.8;width:18px;flex:none}.fi2 small{display:block;opacity:.75;margin-top:2px;font-size:12px}
.subf{display:flex;gap:6px;margin-top:10px}.subf input{flex:1;min-width:0;background:#000;border:1px solid #333a66;border-radius:8px;padding:10px;color:#fff;font:inherit;font-size:13px}.subf button{background:#fff;color:#000;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px}.subf button:hover{background:var(--pri);color:#fff}
.certs{border-top:1px solid #232850;margin-top:30px;padding:18px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;text-align:center}

.fbot{border-top:1px solid #232850;padding:16px 0 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#8c93b8}.fbot a{display:inline;padding:0 0 0 14px;color:#b9bedb}.fbot a:hover{color:#fff}

.abub::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #1d5bff;opacity:.6;animation:ping 2.4s infinite}@keyframes ping{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}

  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ececf4"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a8aa3">${fmt(max*i/4)}</text>`}
  labels.forEach((l,i)=>{const bw=gw*.7/k;series.forEach((s,j)=>{const bh=(H-pt-pb)*s.vals[i]/max,x=pl+i*gw+gw*.15+j*bw,y=H-pb-bh;g+=`<rect class="bar-r" x="${x}" y="${y}" width="${bw*.92}" height="${Math.max(bh,0)}" rx="5" fill="${s.color}" style="animation-delay:${i*50}ms"><title>${esc(l)} · ${esc(s.name)}: ${fmt(s.vals[i])}</title></rect>`});g+=`<text x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6b6b85">${esc(l)}</text>`});
  const lg=series.length>1?`<div class="row sm" style="justify-content:center;gap:16px;margin-top:6px">${series.map(s=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color};margin-right:6px"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>${lg}`;
}
function lineChart(labels,vals,color='#7c3aed'){
  const W=600,H=200,pl=34,pb=26,pt=12,pr=12,max=Math.max(1,...vals),n=labels.length,sx=i=>pl+(W-pl-pr)*(n===1?.5:i/(n-1)),sy=v=>H-pb-(H-pt-pb)*v/max;let g='';
  for(let i=0;i<=3;i++){const y=pt+(H-pt-pb)*(1-i/3);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ececf4"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a8aa3">${Math.round(max*i/3)}</text>`}
  const pts=vals.map((v,i)=>sx(i)+','+sy(v)).join(' ');
  g+=`<polygon points="${sx(0)},${H-pb} ${pts} ${sx(n-1)},${H-pb}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"><title>${esc(labels[i])}: ${v}</title></circle><text x="${sx(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="#6b6b85">${esc(labels[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}
function donut(data){
  const tot=data.reduce((a,d)=>a+d.v,0);if(!tot)return '<p class="mut sm">No data yet.</p>';let off=25;const R=15.9155;let seg='';

  return `<div class="row nw" style="gap:18px"><svg viewBox="0 0 42 42" style="width:140px;flex:none">${seg}<text x="21" y="23" text-anchor="middle" font-size="7" font-weight="800" fill="#14142b">${tot}</text></svg><div class="legend">${data.map(d=>`<div><i style="background:${d.c}"></i>${esc(d.l)} <b>${d.v}</b></div>`).join('')}</div></div>`;
}

function sprintCard(s,p,u,isC,isF,isA){

  if(s.status==='proposed'&&isF&&!isA)act=`<button class="btn s bad" onclick="spDel('${s.id}')">Withdraw</button>`;
  if(s.status==='approved'&&cl)act=`<button class="btn s pri" onclick="reqFund('${s.id}')">Fund this sprint (${money(f.client)})</button><button class="btn s bad" onclick="spDel('${s.id}')">Remove</button>`;
  if(s.status==='approved'&&isF&&!isA)act=`<span class="sm mut">Waiting for client to fund</span>`;
  if(s.status==='payment_pending'){
    if(cl)act=s.payLink?`<a class="btn s pri" href="${esc(s.payLink)}" target="_blank" rel="noopener">Pay ${money(f.client)} securely (Stripe)</a>`:`<span class="sm mut">Payment link coming from admin shortly…</span>`;
    if(isA)act+=`<button class="btn s dark" onclick="setLink('${s.id}')">${s.payLink?'Edit':'Add'} Stripe link</button><button class="btn s ok" onclick="confirmFunded('${s.id}')">Confirm funded</button>`;
    if(isF&&!isA)act=`<span class="sm mut">Client payment in progress</span>`;
  }
  if(s.status==='funded'&&isF)act=`<button class="btn s pri" onclick="submitForm('${s.id}')">Submit work</button>`;
  if(s.status==='submitted'&&cl)act=`<button class="btn s ok" onclick="acceptSp('${s.id}')">Approve & release</button><button class="btn s" onclick="changesSp('${s.id}')">Request changes</button>`;
  if(s.status==='submitted'&&isF&&!isA)act=`<span class="sm mut">Waiting for client review</span>`;
  if(s.status==='accepted'&&isA)act=`<button class="btn s ok" onclick="payoutModal('${s.id}')">Mark paid out</button>`;
  if(s.status==='accepted'&&!isA)act=`<span class="sm mut">Payout due ${fdate(s.payoutDue)}</span>`;
  if(['funded','submitted','accepted'].includes(s.status)&&(isC||isF)&&!isA)act+=`<button class="btn s bad" onclick="disputeModal('${s.id}')">Raise dispute</button>`;
  return `<div class="card reveal" style="margin-bottom:12px"><div class="row sp"><b>${esc(s.title)}</b><span>${sbadge(s.status)} ${overdue(s)?'<span class="badge bg-bad">⚠ Overdue</span>':''}</span></div>
  <div class="row sp" style="margin:8px 0"><span class="b" style="font-size:20px">${money(s.amount)}</span><span class="sm mut">Due ${fdate(s.deadline)}${['funded','approved','proposed'].includes(s.status)?' · '+cdown(s.deadline):''}</span></div>${stepper(s)}
  <div class="sm mut">${isF&&!isA?`You receive <b>${money(payoutAmt(s))}</b> (after ${db.settings.freelancerFee}% fee)`:`Client pays <b>${money(f.client)}</b> (incl. ${db.settings.clientFee}% fee)`}${isA?` · Freelancer gets <b>${money(payoutAmt(s))}</b> · Platform earns <b>${money(f.plat)}</b>`:''}</div>
  ${s.note?`<p class="sm" style="margin-top:8px;white-space:pre-wrap">${esc(s.note)}</p>`:''}${s.delivery?`<p class="sm" style="margin-top:6px">📎 Delivery: <a class="b pri-t" href="${esc(s.delivery)}" target="_blank" rel="noopener">${esc(s.delivery)}</a>${s.subNote?'<br>'+esc(s.subNote):''}</p>`:''}
  <div class="row" style="margin-top:12px">${act}</div></div>`;

function resolveD(did,how){

function vSkills(){

  return `<div class="wrap sec"><h2>Skill verification 🏅</h2><p class="mut" style="margin:6px 0 20px">5 questions per test. Score 4/5 or more to earn a badge. Verified freelancers rank higher on bids.</p><div class="grid g3">${Object.keys(QZ).map(k=>`<div class="card reveal"><div style="font-size:30px">${ICON[k]}</div><h3 style="margin:6px 0">${k}</h3>${u.badges.includes(k)?'<span class="badge bg-ok">✔ Verified</span>':`<a class="btn s pri" href="#/quiz/${encodeURIComponent(k)}">Start test</a>`}</div>`).join('')}</div></div>`;
}
function vQuiz(k){
  k=decodeURIComponent(k||'');const u=me();if(!u)return gate('Skill test');const q=QZ[k];if(!q)return nf();
  return `<div class="wrap sec" style="max-width:660px"><a href="#/skills" class="mut sm">← Tests</a><h2 style="margin:8px 0 16px">${ICON[k]} ${k} test</h2>${q.map((x,i)=>`<div class="card" style="margin-bottom:12px"><b>${i+1}. ${esc(x[0])}</b>${x[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn pri wide" onclick="gradeQuiz('${k}')">Submit answers</button></div>`;
}
function gradeQuiz(k){
  const q=QZ[k];let sc=0;for(let i=0;i<q.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r)return toast('Answer all questions','err');if(+r.value===q[i][2])sc++}
  const u=me();
  if(sc>=4){if(!u.badges.includes(k))u.badges.push(k);logAct(`Passed ${k} test (${sc}/5)`);save();modal(`<div class="c"><div style="font-size:54px">🏅</div><h3>Verified! ${sc}/5</h3><p class="mut sm" style="margin:8px 0 16px">${k} badge added to your profile.</p><button class="btn pri wide" onclick="closeModal();go('#/skills')">Continue</button></div>`)}
  else modal(`<div class="c"><div style="font-size:54px">📚</div><h3>${sc}/5 — not quite</h3><p class="mut sm" style="margin:8px 0 16px">You need 4/5. Review the basics and try again.</p><button class="btn pri wide" onclick="closeModal();route()">Retry</button></div>`);
}

function pfMatch(p){

function aOver(){
  const m=metrics(),S=db.sprints,us=db.users;
  const att=[[db.projects.filter(p=>p.status==='pending').length,'Projects to approve','📝',"adminGo('projects','pending')"],[db.projects.filter(p=>p.status==='assign_pending').length,'Assignments to confirm','🤝',"adminGo('projects','assign_pending')"],[us.filter(u=>u.status==='pending').length,'Users to approve','🧑‍💻',"adminGo('people','pending')"],[S.filter(s=>s.status==='payment_pending').length,'Payments to collect','💳',"adminGo('payments')"],[S.filter(s=>s.status==='accepted'&&s.payoutDue<=today()).length,'Payouts ready','💸',"adminGo('payments')"],[db.disputes.filter(d=>d.status==='open').length,'Open disputes','⚖️',"adminGo('disputes')"],[S.filter(overdue).length,'Overdue sprints','⏰',"adminGo('projects','active')"]];
  const ms=months(6),g={},rv={},su={};ms.forEach(x=>{g[x.k]=0;rv[x.k]=0;su[x.k]=0});
  S.filter(s=>s.fundedAt&&s.status!=='refunded').forEach(s=>{const k=mkey(s.fundedAt);if(k in g)g[k]+=fees(s.amount).client});
  S.filter(s=>s.acceptedAt&&['accepted','paid'].includes(s.status)).forEach(s=>{const k=mkey(s.acceptedAt);if(k in rv)rv[k]+=fees(s.amount).plat});
  us.filter(u=>u.role!=='admin').forEach(u=>{const k=mkey(u.created);if(k in su)su[k]++});
  let cum=us.filter(u=>u.role!=='admin'&&mkey(u.created)<ms[0].k).length;const cumv=ms.map(x=>cum+=su[x.k]);
  const cats=CATS.map((c,i)=>({l:c,v:db.projects.filter(p=>p.cat===c).length,c:COL[i]})).filter(x=>x.v);
  const st=['pending','open','assign_pending','active','completed','rejected','cancelled'];
  const top=us.filter(u=>u.role==='freelancer').map(f=>({f,e:earned(f.id,['accepted','paid']),r:rating(f.id)})).sort((a,b)=>b.e-a.e).slice(0,5);
  const od=S.filter(overdue),act=db.projects.filter(p=>p.status==='active'),hot=att.filter(a=>a[0]);
  return `<div class="card reveal"><h3>Needs your attention</h3><div class="grid g4" style="margin-top:12px">${att.map(a=>`<button class="tile ${a[0]?'hot':''}" onclick="${a[3]}"><span>${a[2]}</span><b>${a[0]}</b><span class="sm mut">${a[1]}</span></button>`).join('')}</div>${hot.length?'':'<p class="mut sm" style="margin-top:10px">🎉 Nothing needs action right now.</p>'}</div>
  <div class="grid g4 keep" style="margin-top:16px">${kpi('Gross volume',m0(m.gmv),'all funded sprints','💵','')}${kpi('Platform revenue',m0(m.rev),'fees on accepted work','📈','')}${kpi('Funds held',m0(m.held),'in escrow now','🏦','')}${kpi('Payouts owed',m0(m.owed),m0(m.paidOut)+' paid so far','💸',"")}</div>
  <div class="grid g4 keep" style="margin-top:16px">${kpi('Active projects',act.length,db.projects.filter(p=>p.status==='open').length+' open for bids','⚡')}${kpi('Freelancers',us.filter(u=>u.role==='freelancer'&&u.status==='active').length,us.filter(u=>u.role==='freelancer'&&u.status==='pending').length+' pending','🧑‍💻')}${kpi('Clients',us.filter(u=>u.role==='client').length,'','🧑‍💼')}${kpi('Completion',m.started?Math.round(m.done/m.started*100)+'%':'—',m.done+' of '+m.started+' started','✅')}</div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card reveal"><h3>Money by month</h3>${groupBars(ms.map(x=>x.l),[{name:'Gross volume',color:'#ff5a1f',vals:ms.map(x=>g[x.k])},{name:'Platform revenue',color:'#7c3aed',vals:ms.map(x=>rv[x.k])}])}</div><div class="card reveal"><h3>User growth</h3>${lineChart(ms.map(x=>x.l),cumv)}</div></div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card reveal"><h3 style="margin-bottom:12px">Projects by category</h3>${donut(cats)}</div><div class="card reveal"><h3>Project pipeline</h3>${hbars(st.map(s=>({l:PS[s][0],v:db.projects.filter(p=>p.status===s).length})))}</div></div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card reveal"><h3>⚠ Overdue sprints</h3>${od.map(s=>`<a class="item row sp nw" style="display:flex" href="#/workspace/${s.projectId}"><div><b class="sm">${esc(s.title)}</b><div class="sm mut">${esc(P(s.projectId)?.title)} · ${cdown(s.deadline)}</div></div><span class="badge bg-bad">Overdue</span></a>`).join('')||'<p class="mut sm" style="margin-top:8px">All on schedule.</p>'}</div>
  <div class="card reveal"><h3>Top freelancers</h3>${top.map((t,i)=>`<a class="item row sp nw" style="display:flex" href="#/freelancer/${t.f.id}"><div class="row nw"><b>${i+1}</b><div><b class="sm">${esc(t.f.name)}</b><div class="sm mut">${t.r.n?stars(t.r.avg)+' '+t.r.avg.toFixed(1):'No reviews'}</div></div></div><b>${money(t.e)}</b></a>`).join('')}</div></div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card reveal"><h3>Active workspaces</h3>${act.map(p=>{const s=S.filter(x=>x.projectId===p.id),t=s.reduce((a,x)=>a+x.amount,0),d=s.filter(x=>['accepted','paid'].includes(x.status)).reduce((a,x)=>a+x.amount,0);return `<a class="item" style="display:block" href="#/workspace/${p.id}"><div class="row sp nw"><div><b class="sm">${esc(p.title)}</b><div class="sm mut">${esc(U(p.clientId).name)} → ${esc(U(p.freelancerId).name)}</div></div><span class="b sm pri-t">Open →</span></div><div class="bar" style="margin-top:6px"><i style="width:${t?d/t*100:0}%"></i></div></a>`}).join('')||'<p class="mut sm" style="margin-top:8px">None yet.</p>'}</div>
  <div class="card reveal"><div class="row sp"><h3>Recent activity</h3><button class="btn s" onclick="setTab('activity')">All</button></div>${db.log.slice(-8).reverse().map(l=>`<div class="item sm"><b>${esc(l.by)}</b> ${esc(l.text)}<div class="mut">${ago(l.ts)}</div></div>`).join('')}</div></div>`;
}
/* ---- projects ---- */
function projActions(p){
  return `${p.status==='pending'?`<button class="btn s ok" onclick="projSet('${p.id}','open')">Approve</button><button class="btn s bad" onclick="rejectProj('${p.id}')">Reject</button>`:''}${p.status==='assign_pending'?`<button class="btn s ok" onclick="confirmAssign('${p.id}')">Confirm ${esc(U(p.freelancerId).name)}</button>`:''}${p.status==='open'?`<button class="btn s dark" onclick="assignDirect('${p.id}')">Assign directly</button>`:''}${['active','completed'].includes(p.status)?`<a class="btn s" href="#/workspace/${p.id}">Workspace</a>`:''}${['pending','open','rejected','assign_pending'].includes(p.status)?`<a class="btn s" href="#/edit/${p.id}">Edit</a>`:''}${['completed','cancelled','rejected'].includes(p.status)?`<button class="btn s bad" onclick="delProj('${p.id}')">Delete</button>`:''}`;
}
function plistAdmin(){
  const l=db.projects.filter(p=>(AF.pstatus==='all'||p.status===AF.pstatus)&&(!AF.pq||(p.title+U(p.clientId).name).toLowerCase().includes(AF.pq.toLowerCase()))).sort((a,b)=>b.created-a.created);
  return l.map(p=>`<div class="item"><div class="row sp"><a href="#/project/${p.id}"><b>${esc(p.title)}</b><div class="sm mut">${esc(U(p.clientId).name)}${p.freelancerId?' → '+esc(U(p.freelancerId).name):''} · ${m0(p.min)}–${m0(p.max)} · ${db.bids.filter(b=>b.projectId===p.id).length} bids · ${ago(p.created)}</div></a>${pbadge(p.status)}</div><div class="row" style="margin-top:8px">${projActions(p)}</div></div>`).join('')||'<p class="mut">No projects match.</p>';
}
function aProj(){
  const st=['all','pending','assign_pending','open','active','completed','rejected','cancelled'];
  return `<div class="row" style="margin-bottom:12px"><input class="inp" style="flex:1;min-width:200px" placeholder="Search project or client…" value="${esc(AF.pq)}" oninput="AF.pq=this.value;$('#alist').innerHTML=plistAdmin()"></div><div class="tabs">${st.map(s=>`<button class="tab ${AF.pstatus===s?'on':''}" onclick="AF.pstatus='${s}';route()">${s==='all'?'All':PS[s][0]} (${s==='all'?db.projects.length:db.projects.filter(p=>p.status===s).length})</button>`).join('')}</div><div class="card" id="alist">${plistAdmin()}</div>`;
}
function delProj(id){confirmBox('Permanently delete this project and its bids, sprints and chat?',()=>{db.bids=db.bids.filter(b=>b.projectId!==id);db.sprints=db.sprints.filter(s=>s.projectId!==id);db.msgs=db.msgs.filter(m=>m.projectId!==id);db.files=db.files.filter(f=>f.projectId!==id);db.disputes=db.disputes.filter(d=>d.projectId!==id);db.projects=db.projects.filter(p=>p.id!==id);logAct('Deleted a project');save();toast('Deleted');route()},{ok:'Delete',danger:true})}
/* ---- people ---- */
function ulistAdmin(){
  const l=db.users.filter(x=>x.role!=='admin'&&(AF.urole==='all'||x.role===AF.urole)&&(AF.ustatus==='all'||x.status===AF.ustatus)&&(!AF.uq||(x.name+x.email).toLowerCase().includes(AF.uq.toLowerCase()))).sort((a,b)=>b.created-a.created);
  return l.map(x=>`<div class="item"><div class="row sp"><div class="row nw"><div class="avatar s">${ini(x.name)}</div><div><b>${esc(x.name)}</b> <span class="badge bg-gray">${x.role}</span><div class="sm mut">${esc(x.email)} · ${esc(x.country||'')}${x.tax?' · '+x.tax:''}</div></div></div><span class="badge ${x.status==='active'?'bg-ok':x.status==='pending'?'bg-warn':'bg-bad'}">${x.status}</span></div><div class="row" style="margin-top:8px">${x.status!=='active'?`<button class="btn s ok" onclick="uSet('${x.id}','active')">${x.status==='pending'?'Approve':'Reactivate'}</button>`:`<button class="btn s bad" onclick="uSet('${x.id}','suspended')">Suspend</button>`}<button class="btn s" onclick="userModal('${x.id}')">Details</button><button class="btn s dark" onclick="viewAs('${x.id}')">View as</button></div></div>`).join('')||'<p class="mut">No users match.</p>';
}
function aPeople(){
  return `<div class="row" style="margin-bottom:12px"><input class="inp" style="flex:1;min-width:200px" placeholder="Search name or email…" value="${esc(AF.uq)}" oninput="AF.uq=this.value;$('#alist').innerHTML=ulistAdmin()"></div><div class="tabs">${[['urole','all'],['urole','client'],['urole','freelancer'],['ustatus','pending'],['ustatus','suspended']].map(f=>`<button class="tab ${AF[f[0]]===f[1]&&(f[0]==='urole'||AF.ustatus!=='all')?'on':''}" onclick="${f[0]==='urole'?`AF.urole='${f[1]}';AF.ustatus='all'`:`AF.ustatus='${f[1]}';AF.urole='all'`};route()">${f[1]==='all'?'Everyone':f[1][0].toUpperCase()+f[1].slice(1)}</button>`).join('')}</div><div class="card" id="alist">${ulistAdmin()}</div>`;
}
function uSet(id,s){const x=U(id);x.status=s;notify(id,s==='active'?'Your account is approved. Welcome to Freevance!':`Your account status changed to ${s}`,'#/dashboard');logAct(`${s==='active'?'Approved':'Suspended'} ${x.name}`);save();toast('Updated ✔');route()}
function userModal(id){
  const x=U(id),pr=db.projects.filter(p=>p.clientId===id||p.freelancerId===id);
  modal(`<div class="row nw"><div class="avatar">${ini(x.name)}</div><div><b>${esc(x.name)}</b><div class="sm mut">${esc(x.email)}</div></div></div><div style="margin:14px 0">
  <div class="lr"><span>Role</span><b>${x.role}</b></div><div class="lr"><span>Status</span><b>${x.status}</b></div><div class="lr"><span>Country</span><b>${esc(x.country||'—')}</b></div><div class="lr"><span>Joined</span><b>${fdate(x.created)}</b></div><div class="lr"><span>Projects</span><b>${pr.length}</b></div>
  ${x.role==='freelancer'?`<div class="lr"><span>Earned</span><b>${money(earned(id,['accepted','paid']))}</b></div><div class="lr"><span>Payout</span><b>${x.payout&&x.payout.detail?esc(x.payout.method+' · '+x.payout.detail):'Not set'}</b></div><div class="lr"><span>Tax form</span><b>${x.taxFile?`<a class="pri-t" download="${esc(x.taxFile.name)}" href="${x.taxFile.data}">${esc(x.taxFile.name)}</a>`:(x.tax||'Missing')}</b></div><div style="margin-top:10px" class="sm mut">Badges (tap to grant/remove)</div><div>${CATS.filter(c=>QZ[c]).map(c=>`<button class="badge ${x.badges.includes(c)?'bg-ok':'bg-gray'}" style="margin:3px" onclick="toggleBadge('${id}','${c}')">${x.badges.includes(c)?'✔ ':''}${c}</button>`).join('')}</div>`:''}</div>
  <div class="row nw"><button class="btn wide" onclick="viewAs('${id}')">View as</button><button class="btn bad wide" onclick="delUser('${id}')">Delete</button></div>`);
}
function toggleBadge(id,c){const x=U(id);x.badges=x.badges.includes(c)?x.badges.filter(b=>b!==c):[...x.badges,c];logAct(`Badge "${c}" changed for ${x.name}`);save();userModal(id)}
function delUser(id){const x=U(id);if(db.projects.some(p=>p.clientId===id||p.freelancerId===id))return toast('User has projects — suspend instead','err');confirmBox(`Delete ${esc(x.name)} permanently?`,()=>{db.bids=db.bids.filter(b=>b.freelancerId!==id);db.users=db.users.filter(u=>u.id!==id);logAct(`Deleted user ${x.name}`);save();toast('Deleted');route()},{ok:'Delete',danger:true})}
/* ---- payments ---- */
function aPay(){
  const q1=db.sprints.filter(s=>s.status==='payment_pending'),q2=db.sprints.filter(s=>s.status==='accepted').sort((a,b)=>a.payoutDue>b.payoutDue?1:-1),m=metrics();
  const row=(s,b)=>`<div class="item"><div class="row sp"><div><b>${esc(s.title)}</b><div class="sm mut">${esc(P(s.projectId)?.title)}</div></div><b>${money(s.amount)}</b></div><div class="row" style="margin-top:6px">${b}</div></div>`;
  const led=db.sprints.filter(s=>AF.ledger==='all'||s.status===AF.ledger).sort((a,b)=>(b.fundedAt||b.created)-(a.fundedAt||a.created));
  return `<div class="grid g4 keep">${kpi('Funds held',m0(m.held),'in escrow','🏦')}${kpi('Owed to freelancers',m0(m.owed),q2.length+' payouts','⏳')}${kpi('Paid out',m0(m.paidOut),'lifetime','✅')}${kpi('Revenue',m0(m.rev),'platform fees','📈')}</div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card"><h3>1. Awaiting client payment</h3>${q1.map(s=>row(s,`<span class="sm mut">Client pays ${money(fees(s.amount).client)}</span><button class="btn s dark" onclick="setLink('${s.id}')">${s.payLink?'Edit':'Add'} Stripe link</button><button class="btn s ok" onclick="confirmFunded('${s.id}')">Confirm funded</button>`)).join('')||'<p class="mut sm" style="margin-top:8px">Nothing waiting. (Demo checkout is on — clients pay instantly in test mode.)</p>'}</div>
  <div class="card"><h3>2. Freelancer payout queue</h3>${q2.map(s=>row(s,`<span class="sm mut">Pay <b>${esc(U(P(s.projectId)?.freelancerId).name)}</b> ${money(payoutAmt(s))} · due ${fdate(s.payoutDue)} ${s.payoutDue<=today()?'<span class="badge bg-ok">Ready</span>':'<span class="badge bg-warn">Holding</span>'}</span><button class="btn s ok" onclick="payoutModal('${s.id}')">Mark paid out</button>`)).join('')||'<p class="mut sm" style="margin-top:8px">Queue empty.</p>'}</div></div>
  <div class="card" style="margin-top:16px"><div class="row sp"><h3>Ledger</h3><select class="inp" style="width:190px" onchange="AF.ledger=this.value;route()"><option value="all">All statuses</option>${Object.keys(SS).map(k=>`<option value="${k}" ${AF.ledger===k?'selected':''}>${SS[k][0]}</option>`).join('')}</select></div><div class="tw" style="margin-top:10px"><table class="tbl"><tr><th>Project</th><th>Sprint</th><th>Amount</th><th>Client paid</th><th>Freelancer</th><th>Fee</th><th>Status</th><th>Due</th></tr>${led.map(s=>{const f=fees(s.amount);return `<tr><td>${esc(P(s.projectId)?.title||'')}</td><td>${esc(s.title)}</td><td>${money(s.amount)}</td><td>${money(f.client)}</td><td>${money(payoutAmt(s))}</td><td>${money(f.plat)}</td><td>${sbadge(s.status)}</td><td>${fdate(s.deadline)}</td></tr>`}).join('')}</table></div></div>`;
}
function exportLedger(){const rows=[['Project','Sprint','Amount','Client pays','Freelancer gets','Platform fee','Status','Deadline','Payout due','Payout ref']];db.sprints.forEach(s=>{const f=fees(s.amount);rows.push([P(s.projectId)?.title,s.title,s.amount,f.client.toFixed(2),payoutAmt(s).toFixed(2),f.plat.toFixed(2),s.status,s.deadline,s.payoutDue||'',s.payoutRef||''])});dl('freevance-ledger-'+today()+'.csv',rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
/* ---- disputes / activity ---- */
function aDisp(){
  return `<div class="card">${db.disputes.slice().reverse().map(d=>{const x=SPR(d.sprintId);return `<div class="item"><div class="row sp"><div><b>${esc(x?.title)}</b> · ${esc(P(d.projectId)?.title)}<div class="sm mut">Raised by ${esc(U(d.by).name)} · ${ago(d.created)} · ${money(x?fees(x.amount).client:0)} in dispute</div></div><span class="badge ${d.status==='open'?'bg-bad':'bg-gray'}">${d.status}</span></div><p class="sm" style="margin:8px 0">${esc(d.reason)}</p>${d.status==='open'?`<div class="row"><a class="btn s" href="#/workspace/${d.projectId}" onclick="WT='sprints'">View workspace & chat</a><button class="btn s ok" onclick="resolveD('${d.id}','release')">Release to freelancer</button><button class="btn s" onclick="resolveD('${d.id}','split')">Split 50/50</button><button class="btn s bad" onclick="resolveD('${d.id}','refund')">Refund client</button></div>`:`<span class="sm mut">Resolved: ${d.resolution}</span>`}</div>`}).join('')||'<p class="mut">No disputes. 🎉</p>'}</div>`;
}
function aAct(){return `<div class="card"><h3>Activity log</h3><div class="tw"><table class="tbl"><tr><th>When</th><th>Who</th><th>What</th></tr>${db.log.slice().reverse().slice(0,120).map(l=>`<tr><td class="mut" style="white-space:nowrap">${ago(l.ts)}</td><td><b>${esc(l.by)}</b></td><td>${esc(l.text)}</td></tr>`).join('')}</table></div></div>`}
/* ---- settings ---- */
function aSet(){
  const s=db.settings;
  return `<div class="card"><h3 style="margin-bottom:12px">Platform settings</h3><div class="grid g2">${fld('Client fee %',`<input id="sc" type="number" class="inp" value="${s.clientFee}">`)}${fld('Freelancer fee %',`<input id="sf" type="number" class="inp" value="${s.freelancerFee}">`)}${fld('Payout hold (days after approval)',`<input id="sh" type="number" class="inp" value="${s.holdDays}">`)}${fld('Admin email',`<input id="sa" class="inp" value="${esc(s.adminEmail)}">`)}${fld('Legal entity',`<input id="se" class="inp" value="${esc(s.entity)}">`)}${fld('Governing-law state',`<input id="ss" class="inp" value="${esc(s.state)}">`)}${fld('Support email',`<input id="sp" class="inp" value="${esc(s.support)}">`)}${fld('OTP server URL (blank = demo mode)',`<input id="so" class="inp" value="${esc(s.otpEndpoint)}" placeholder="https://your-fn.example.com/otp">`)}</div>${fld('Site-wide announcement (blank = none)',`<input id="sn" class="inp" value="${esc(s.announce||'')}" placeholder="e.g. Scheduled maintenance Sunday 2am EST">`)}
  <label class="sm" style="display:flex;gap:8px;margin:4px 0 8px"><input type="checkbox" id="sd" ${s.demoOtp?'checked':''}> Show OTP on screen (demo mode — turn OFF when live)</label>
  <label class="sm" style="display:flex;gap:8px;margin:0 0 8px"><input type="checkbox" id="sdp" ${s.demoPayments?'checked':''}> Demo checkout (test card instead of real Stripe — turn OFF when live)</label>
  <label class="sm" style="display:flex;gap:8px;margin:0 0 14px"><input type="checkbox" id="sw" ${s.demoSwitcher?'checked':''}> Show Admin / Client / Freelancer demo toggle (turn OFF before launch)</label><button class="btn pri" onclick="saveSettings()">Save settings</button></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:10px">Data</h3><div class="row"><button class="btn" onclick="exportJSON()">⬇ Backup (JSON)</button><label class="btn">⬆ Restore<input type="file" accept=".json" hidden onchange="importJSON(this)"></label><button class="btn" onclick="confirmBox('Replace all data with fresh demo data?',()=>{resetDemo()},{ok:'Reset to demo data'})">↺ Reset demo data</button><button class="btn bad" onclick="wipe()">Delete everything</button></div><p class="sm mut" style="margin-top:10px">${storageOK?'This MVP stores data in this browser only. Back up often.':'⚠ Storage is blocked in this browser — data will not persist.'} A shared database is needed before real users.</p></div>`;
}
function saveSettings(){const s=db.settings;Object.assign(s,{clientFee:+val('sc')||0,freelancerFee:+val('sf')||0,holdDays:+val('sh')||0,adminEmail:val('sa'),entity:val('se'),state:val('ss'),support:val('sp'),otpEndpoint:val('so').replace(/\/$/,''),announce:val('sn'),demoOtp:$('#sd').checked,demoPayments:$('#sdp').checked,demoSwitcher:$('#sw').checked});annHidden=false;save();toast('Saved ✔');route()}
function exportJSON(){dl('freevance-backup-'+today()+'.json',JSON.stringify(db),'application/json')}
function importJSON(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users)throw 0;db=d;save();toast('Restored ✔');route()}catch(e){toast('Invalid file','err')}};r.readAsText(f)}
function resetDemo(){LS.del(KEY);LS.del('fv_return');db=seed();LS.set('fv_session','admin');toast('Demo data restored');go('#/admin')}
function wipe(){confirmBox('Delete ALL data? This cannot be undone.',()=>{db={settings:Object.assign(seed().settings,{}),users:[],projects:[],bids:[],sprints:[],msgs:[],files:[],notifs:[],log:[],disputes:[]};save();LS.del('fv_session');LS.del('fv_return');toast('All data deleted. Log in with the admin email to start.');go('#/')},{ok:'Delete everything',danger:true,title:'Delete everything?'})}
/* =================== boot =================== */
tick();route();v3boot();setInterval(()=>{tick();renderChrome()},60000);
</script>
</body>
</html>
